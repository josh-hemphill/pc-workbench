name: Node.js and pnpm
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm probe:runtime
      - run: pnpm build
      - run: pnpm package:sea
      - run: pnpm test:sea
      - run: pnpm stage:tauri-sidecar
      - run: pnpm build:desktop
      - run: pnpm package:desktop
      - run: pnpm test:desktop-package
      - name: Install Linux native-window prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libxdo-dev xvfb xauth xdotool dbus-x11 x11-utils python3
      - name: Verify Linux native rendering, navigation and close behavior
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a dbus-run-session -- pnpm test:desktop-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-backend-prototype-${{ matrix.os }}
          path: bin/pc-workbench-node-*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-desktop-experiment-${{ matrix.os }}
          path: bin/pc-workbench-desktop-*
          if-no-files-found: error
